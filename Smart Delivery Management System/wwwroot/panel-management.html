<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול משלוחים - Smart Delivery</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', sans-serif;
        }

        .admin-container {
            max-width: 1200px;
            margin: 30px auto;
        }

        .card {
            border-radius: 15px;
            border: none;
            margin-bottom: 20px;
        }

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .status-pending {
            color: orange;
            font-weight: bold;
        }

        .status-delivered {
            color: green;
            font-weight: bold;
        }

        .status-cancelled {
            color: red;
            text-decoration: line-through;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <span class="navbar-brand">פאנל מנהל מערכת</span>
            <button class="btn btn-light btn-sm" onclick="logout()">התנתק</button>
        </div>
    </nav>

    <div class="container admin-container">
        <div class="card shadow">
            <div class="card-body">
                <h5 class="card-title mb-4">יצירת משלוח חדש</h5>
                <form id="deliveryForm" class="row g-3">
                    <div class="col-md-4">
                        <input type="text" id="pickupAddress" class="form-control" placeholder="כתובת איסוף" list="pickupList" required autocomplete="off">
                        <datalist id="pickupList"></datalist>
                    </div>
                    <div class="col-md-4">
                        <input type="text" id="dropoffAddress" class="form-control" placeholder="כתובת יעד" list="dropoffList" required autocomplete="off">
                        <datalist id="dropoffList"></datalist>
                    </div>
                    <div class="col-md-2">
                        <select id="courierId" class="form-select" required>
                            <option value="">בחר שליח</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-success w-100">צור משלוח</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="table-container shadow">
            <h5 class="mb-4">משלוחים קיימים במערכת</h5>
            <table class="table table-hover">
                <thead class="table-light">
                    <tr>
                        <th>מזהה</th>
                        <th>איסוף</th>
                        <th>יעד</th>
                        <th>שליח</th>
                        <th>סטטוס</th>
                        <th>פעולות</th>
                    </tr>
                </thead>
                <tbody id="deliveriesTableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">עריכת משלוח</h5></div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editId">
                        <div class="mb-3">
                            <label class="form-label">כתובת איסוף</label>
                            <input type="text" id="editPickup" class="form-control" list="pickupList" autocomplete="off">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">כתובת יעד</label>
                            <input type="text" id="editDropoff" class="form-control" list="dropoffList" autocomplete="off">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">סטטוס</label>
                            <select id="editStatus" class="form-select">
                                <option value="Pending">Pending</option>
                                <option value="InTransit">InTransit</option>
                                <option value="Delivered">Delivered</option>
                                <option value="Cancelled">Cancelled</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">שמור שינויים</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const token = localStorage.getItem('userToken');

        if (!token) {
            alert("גישה חסומה! נא להתחבר כמנהל.");
            window.location.href = 'login.html';
        }

        // פונקציה לבדיקת Role מנהל
        function checkAdmin() {
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                const role = payload["role"] || payload["http://schemas.microsoft.com/ws/2008/06/identity/claims/role"];
                if (role !== 'Admin') {
                    alert("גישה למנהלים בלבד!");
                    window.location.href = 'index.html';
                }
            } catch (e) { logout(); }
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkAdmin();
            fetchCouriers();
            loadDeliveries();

            // חיבור השלמה אוטומטית לשדות היצירה
            setupAutocomplete('pickupAddress', 'pickupList');
            setupAutocomplete('dropoffAddress', 'dropoffList');

            // חיבור השלמה אוטומטית לשדות העריכה (התיקון שביקשת)
            setupAutocomplete('editPickup', 'pickupList');
            setupAutocomplete('editDropoff', 'dropoffList');

            setupFormSubmission();
        });

        async function loadDeliveries() {
            try {
                const response = await fetch('/api/Delivery', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const deliveries = await response.json();
                const tbody = document.getElementById('deliveriesTableBody');
                tbody.innerHTML = '';

                deliveries.forEach(d => {
                    tbody.innerHTML += `
                            <tr>
                                <td>${d.id}</td>
                                <td class="small">${d.pickupAddress}</td>
                                <td class="small">${d.dropoffAddress}</td>
                                <td>${d.courierId || 'לא שויך'}</td>
                                <td class="status-${(d.status || 'pending').toLowerCase()}">${d.status}</td>
                                <td>
                                    <button class="btn btn-sm btn-outline-primary" onclick='openEditModal(${JSON.stringify(d)})'>ערוך</button>
                                    <button class="btn btn-sm btn-outline-danger" onclick="cancelDelivery(${d.id})">ביטול</button>
                                </td>
                            </tr>`;
                });
            } catch (err) { console.error("Error", err); }
        }

        async function fetchCouriers() {
            const select = document.getElementById('courierId');
            try {
                const response = await fetch('/api/Courier', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const couriers = await response.json();
                select.innerHTML = '<option value="">בחר שליח</option>';
                couriers.forEach(c => {
                    select.innerHTML += `<option value="${c.id}">${c.name || c.id}</option>`;
                });
            } catch (err) { console.error(err); }
        }

        function setupAutocomplete(inputId, listId) {
            const input = document.getElementById(inputId);
            const list = document.getElementById(listId);
            let timeout = null;

            input.addEventListener('input', () => {
                clearTimeout(timeout);
                timeout = setTimeout(async () => {
                    const query = input.value;
                    if (query.length < 3) return;
                    try {
                        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5&addressdetails=1&countrycodes=il&accept-language=he`);
                        const data = await res.json();
                        list.innerHTML = '';
                        data.forEach(item => {
                            const a = item.address;
                            const clean = `${a.road || ''} ${a.house_number || ''}, ${a.city || a.town || ''}`.replace(/^ ,/, '').trim();
                            const opt = document.createElement('option');
                            opt.value = clean || item.display_name.split(',')[0];
                            list.appendChild(opt);
                        });
                    } catch (e) { console.error(e); }
                }, 300);
            });
        }

        function setupFormSubmission() {
            document.getElementById('deliveryForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const payload = {
                    pickupAddress: document.getElementById('pickupAddress').value,
                    dropoffAddress: document.getElementById('dropoffAddress').value,
                    courierId: parseInt(document.getElementById('courierId').value),
                    status: "Pending"
                };
                const res = await fetch('/api/Delivery', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(payload)
                });
                if (res.ok) { alert("נוצר!"); loadDeliveries(); e.target.reset(); }
            });
        }

        function openEditModal(d) {
            document.getElementById('editId').value = d.id;
            document.getElementById('editPickup').value = d.pickupAddress;
            document.getElementById('editDropoff').value = d.dropoffAddress;
            document.getElementById('editStatus').value = d.status;
            new bootstrap.Modal(document.getElementById('editModal')).show();
        }

        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const payload = {
                id: parseInt(id),
                pickupAddress: document.getElementById('editPickup').value,
                dropoffAddress: document.getElementById('editDropoff').value,
                status: document.getElementById('editStatus').value
            };
            const res = await fetch(`/api/Delivery/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
                loadDeliveries();
            }
        });

        async function cancelDelivery(id) {
            if (confirm("לבטל?")) {
                await fetch(`/api/Delivery/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
                loadDeliveries();
            }
        }

        function logout() {
            localStorage.removeItem('userToken');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
