<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Delivery | ממשק שליחים ומסלולים</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --primary-dark: #2c3e50;
            --accent: #3498db;
        }

        body {
            background-color: #f1f3f5;
            font-family: 'Segoe UI', system-ui;
        }

        .sidebar {
            background: white;
            height: 100vh;
            border-left: 1px solid #dee2e6;
            overflow-y: auto;
        }

        .nav-header {
            background: var(--primary-dark);
            color: white;
            padding: 20px;
            margin-bottom: 10px;
        }

        #map {
            height: 500px;
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            border: 2px solid white;
        }

        .courier-card {
            cursor: pointer;
            border: none;
            border-bottom: 1px solid #f0f0f0;
            transition: 0.3s;
            border-right: 4px solid transparent;
        }

            .courier-card:hover {
                background: #f8f9fa;
            }

            .courier-card.active {
                background: #e7f1ff;
                border-right-color: var(--accent);
            }

        .route-step {
            position: relative;
            padding-right: 35px;
            margin-bottom: 15px;
        }

            .route-step::before {
                content: attr(data-step);
                position: absolute;
                right: 0;
                top: 0;
                width: 25px;
                height: 25px;
                background: var(--accent);
                color: white;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 12px;
            }
    </style>
</head>
<body>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 sidebar p-0">
                <div class="nav-header text-center">
                    <h4 class="mb-0">Smart Delivery</h4>
                    <small>מערכת ניהול משלוחים חכמה</small>
                </div>
                <div class="p-3">
                    <h6 class="text-muted mb-3">בחר שליח לצפייה במסלול:</h6>
                    <div id="courier-list" class="list-group list-group-flush">
                        <div class="text-center p-3"><div class="spinner-border spinner-border-sm"></div></div>
                    </div>
                </div>
            </div>

            <div class="col-md-9 p-4">
                <div id="welcome-msg" class="text-center py-5">
                    <i class="bi bi-truck display-1 text-muted"></i>
                    <h2 class="mt-3">ברוכים הבאים למערכת הניתוב</h2>
                    <p class="text-muted">בחר שליח מהרשימה כדי לראות את המסלול האופטימלי שחושב עבורו.</p>
                </div>

                <div id="main-content" style="display: none;">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h3 id="courier-title">שם השליח</h3>
                        <span class="badge bg-success" id="status-label">פעיל - מסלול אופטימלי</span>
                    </div>

                    <div class="row">
                        <div class="col-12 mb-4">
                            <div id="map"></div>
                        </div>

                        <div class="col-12">
                            <div class="card shadow-sm border-0">
                                <div class="card-header bg-white fw-bold">סדר עצירות אופטימלי (Nearest Neighbor)</div>
                                <div class="card-body">
                                    <div id="route-details" class="row">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // הגדרות API - שנה את הפורט בהתאם לשרת שלך
        const API_BASE = "https://localhost:44333/api";

        const map = L.map('map').setView([32.0853, 34.7818], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        let markersLayer = L.layerGroup().addTo(map);
        let polylineLayer = L.layerGroup().addTo(map);

        // 1. טעינת שליחים מה-CourierController
        async function loadCouriers() {
            try {
                const res = await fetch(`${API_BASE}/Courier`);
                const couriers = await res.json();
                const list = document.getElementById('courier-list');
                list.innerHTML = '';

                couriers.forEach(c => {
                    const item = document.createElement('div');
                    item.className = 'list-group-item courier-card p-3';
                    item.innerHTML = `
                        <div class="d-flex justify-content-between">
                            <strong>${c.name}</strong>
                            <i class="bi bi-chevron-left text-muted"></i>
                        </div>
                        <small class="text-muted">${c.phoneNumber}</small>
                    `;
                    item.onclick = () => selectCourier(c.id, c.name);
                    list.appendChild(item);
                });
            } catch (err) {
                console.error("Error loading couriers:", err);
                document.getElementById('courier-list').innerHTML = '<div class="alert alert-danger">שגיאה בחיבור לשרת</div>';
            }
        }

        
        // משתנה גלובלי לשמירת גבולות המסלול
        let currentRouteBounds = null;

        // פונקציית הזום-אאוט (חייבת להיות מחוץ ל-selectCourier)
        function zoomToFullRoute() {
            if (currentRouteBounds) {
                map.flyToBounds(currentRouteBounds, {
                    padding: [50, 50],
                    duration: 1.5, // אנימציה חלקה של שנייה וחצי
                    easeLinearity: 0.25
                });
            } else {
                console.warn("No route bounds found.");
            }
        }

        async function selectCourier(id, name) {
            // UI Updates
            document.getElementById('welcome-msg').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';

            // יצירת הכותרת והכפתור (וודא שה-onclick קורא לפונקציה הגלובלית)
            document.getElementById('courier-title').innerHTML = `
        המסלול של ${name} 
        <button class="btn btn-outline-secondary btn-sm ms-3" onclick="zoomToFullRoute()">
            <i class="bi bi-arrows-fullscreen"></i> הצג מסלול מלא
        </button>
    `;

            // תיקון תצוגת המפה
            setTimeout(() => { map.invalidateSize(); }, 100);

            markersLayer.clearLayers();
            polylineLayer.clearLayers();

            try {
                const res = await fetch(`${API_BASE}/Routes/courier/${id}`);
                if (!res.ok) throw new Error("לא נמצא מסלול");

                const routeDto = await res.json();
                const stopsList = routeDto.stops || routeDto.Stops;

                if (!stopsList || stopsList.length === 0) return;

                const routeContainer = document.getElementById('route-details');
                routeContainer.innerHTML = '';
                const pathPoints = [];

                stopsList.forEach((stop, index) => {
                    const lat = stop.latitude || stop.Latitude;
                    const lng = stop.longitude || stop.Longitude;
                    const address = stop.address || stop.Address || stop.dropoffAddress || "כתובת לא ידועה";

                    const pos = [lat, lng];
                    pathPoints.push(pos);

                    const isOrigin = index === 0;

                    // רינדור כרטיס העצירה
                    routeContainer.innerHTML += `
                <div class="col-md-4 mb-3">
                    <div class="route-step ${isOrigin ? 'border-success' : ''}" data-step="${index + 1}">
                        <div class="p-2 border rounded ${isOrigin ? 'bg-success bg-opacity-10' : 'bg-white'} shadow-sm">
                            <small class="${isOrigin ? 'text-success' : 'text-primary'} fw-bold">
                                ${isOrigin ? '<i class="bi bi-house-door-fill"></i> נקודת מוצא' : 'תחנה ' + (index + 1)}
                            </small>
                            <div class="text-truncate" style="font-size: 0.9rem;" title="${address}">
                                <strong>${address}</strong>
                            </div>
                            <div class="mt-2 d-flex justify-content-between">
                                <button class="btn btn-sm btn-link p-0 text-decoration-none" onclick="focusMap(${lat}, ${lng})">
                                    <i class="bi bi-geo-alt"></i> התמקד
                                </button>
                                <a href="https://www.waze.com/ul?ll=${lat},${lng}&navigate=yes" target="_blank" class="btn btn-sm btn-outline-success border-0 py-0">
                                    Waze
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            `;

                    // הוספת מרקרים (רגיל או נקודת מוצא)
                    if (isOrigin) {
                        const homeIcon = L.divIcon({
                            className: 'custom-div-icon',
                            html: `<div style="background-color:#198754; width:30px; height:30px; border-radius:50%; border:2px solid white; display:flex; align-items:center; justify-content:center; color:white; box-shadow: 0 0 10px rgba(0,0,0,0.3);"><i class="bi bi-house-door"></i></div>`,
                            iconSize: [30, 30],
                            iconAnchor: [15, 15]
                        });
                        L.marker(pos, { icon: homeIcon }).bindPopup(`<b>מוצא:</b> ${address}`).addTo(markersLayer);
                    } else {
                        L.marker(pos).bindPopup(`<b>תחנה ${index + 1}:</b> ${address}`).addTo(markersLayer);
                    }
                });

                if (pathPoints.length > 1) {
                    // ציור הקו (כולל חזרה להתחלה)
                    const circularPath = [...pathPoints, pathPoints[0]];
                    const polyline = L.polyline(circularPath, {
                        color: '#3498db',
                        weight: 4,
                        opacity: 0.8,
                        dashArray: '5, 10'
                    }).addTo(polylineLayer);

                    // עדכון המשתנה הגלובלי לצורך ה-Zoom Out
                    currentRouteBounds = polyline.getBounds();
                    map.fitBounds(currentRouteBounds, { padding: [50, 50] });
                }

            } catch (err) {
                console.error(err);
                alert("שגיאה בטעינת המסלול");
            }
        }

        function focusMap(lat, lon) {
                            map.flyTo([lat, lon], 16);
                        }

        // הפעלה ראשונית
        loadCouriers();
    </script>

</body>
</html>
