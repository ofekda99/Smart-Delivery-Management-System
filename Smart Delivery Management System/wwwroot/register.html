﻿
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>הרשמה למערכת | Smart Delivery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body {
            background: #2c3e50;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 450px;
        }
    </style>
</head>
<body>
    <div class="register-card">
        <h3 class="text-center mb-4">יצירת חשבון חדש</h3>
        <form id="registerForm">
            <div class="row">
                <div class="col-md-12 mb-3">
                    <label class="form-label">שם מלא</label>
                    <input type="text" id="fullName" class="form-control" placeholder="ישראל ישראלי" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">אימייל (שם משתמש)</label>
                    <input type="email" id="regUsername" class="form-control" placeholder="example@mail.com" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">טלפון</label>
                    <input type="tel" id="phone" class="form-control" required>
                </div>
                <div class="col-md-12 mb-3">
                    <label class="form-label">סיסמה</label>
                    <input type="password" id="regPassword" class="form-control" required>
                </div>
            </div>
            <button type="submit" class="btn btn-success w-100 mb-3">הירשם עכשיו</button>
            <div class="text-center">
                <a href="login.html" class="small text-decoration-none">כבר יש לך חשבון? התחבר כאן</a>
            </div>
        </form>
        <div id="responseMsg" class="mt-3 text-center small"></div>
    </div>

    <script>
        const API_BASE = "https://localhost:44333/api";

        document.getElementById('registerForm').onsubmit = async function (e) {
            e.preventDefault();
            const msgDiv = document.getElementById('responseMsg');
            msgDiv.innerText = "שולח נתונים...";

            const userData = {
                FullName: document.getElementById('fullName').value,
                Email: document.getElementById('regUsername').value,
                Password: document.getElementById('regPassword').value,
                Role: "Courier" // default role
            };

            try {
                const res = await fetch(`${API_BASE}/User`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(userData)
                });

                if (res.ok) {
                    msgDiv.className = "text-success mt-3 text-center";
                    msgDiv.innerText = "ההרשמה בוצעה בהצלחה! מעביר אותך להתחברות...";
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    const errText = await res.text();
                    throw new Error(errText || "שגיאה ברישום");
                }
            } catch (err) {
                msgDiv.className = "text-danger mt-3 text-center";
                msgDiv.innerText = "שגיאה: " + err.message;
                console.error("Reg error:", err);
            }
        };
    </script>
</body>
</html>
