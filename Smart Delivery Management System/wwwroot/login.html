<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>כניסה למערכת | Smart Delivery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body {
            background: #2c3e50;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 350px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h3 class="text-center mb-4">Smart Delivery</h3>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">אימייל</label>
                <input type="email" id="username" class="form-control" placeholder="example@mail.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">סיסמה</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">התחבר</button>
        </form>

        <div id="errorMsg" class="text-danger mt-3 text-center small" style="display:none;"></div>

        <hr class="my-4">

        <div class="text-center">
            <p class="small text-muted">אין לך חשבון?</p>
            <a href="register.html" class="btn btn-outline-secondary btn-sm w-100">צור חשבון חדש</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const API_BASE = "https://localhost:44333/api";
            const loginForm = document.getElementById('loginForm');
            const errorMsg = document.getElementById('errorMsg');

            if (loginForm) {
                loginForm.onsubmit = async function (e) {
                    e.preventDefault();
                    errorMsg.style.display = 'none'; // hide previous error

                    const emailValue = document.getElementById('username').value;
                    const passwordValue = document.getElementById('password').value;

                    try {
                        const response = await fetch(`${API_BASE}/User/login`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                email: emailValue,
                                password: passwordValue
                            })
                        });

                        if (response.ok) {
                            const data = await response.json();

                            localStorage.setItem('userId', data.id);
                            localStorage.setItem('userRole', data.role);
                            localStorage.setItem('userName', data.fullName);
                            localStorage.setItem('userToken', data.token);
                            localStorage.setItem('userRole', data.role); // indicates whether the user is Admin or Courier

                            // Route by the user role
                            if (data.role === 'Admin') {
                                window.location.href = 'admin.html';
                            } else if (data.role === 'Courier') {
                                window.location.href = `courierView.html`;
                            } else {
                                alert("תפקיד לא מזוהה");
                            }
                        } else {
                            errorMsg.style.display = 'block';
                            errorMsg.innerText = "שם משתמש או סיסמה שגויים";
                        }
                    } catch (error) {
                        console.error("Login error:", error);
                        errorMsg.style.display = 'block';
                        errorMsg.innerText = "שגיאה בתקשורת עם השרת";
                    }
                };
            }
        });
    </script>
</body>
</html>
