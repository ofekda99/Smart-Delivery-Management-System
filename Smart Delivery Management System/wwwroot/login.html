<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>כניסה למערכת | Smart Delivery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body {
            background: #2c3e50;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 350px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h3 class="text-center mb-4">Smart Delivery</h3>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">שם משתמש</label>
                <input type="text" id="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">סיסמה</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">התחבר</button>
        </form>
        <div id="errorMsg" class="text-danger mt-3 text-center small" style="display:none;">פרטים שגויים</div>
    </div>

    <script>
        document.getElementById('loginForm').onsubmit = function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;

            // לוגיקה זמנית (בשלב הבא נחליף בבדיקה מול ה-DB)
            if (user === 'admin') {
                window.location.href = 'admin.html';
            } else {
                // נניח שכל שם אחר הוא שליח, ואנחנו שולחים אותו ל-ID 1 לצורך הבדיקה
                window.location.href = 'courier.html?id=1';
            }
        };
    </script>
</body>
</html>
