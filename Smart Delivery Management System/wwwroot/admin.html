<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Delivery | ממשק ניהול</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        :root {
            --primary-dark: #2c3e50;
            --accent: #3498db;
            --success-green: #198754;
        }

        body {
            background-color: #f1f3f5;
            font-family: 'Segoe UI', system-ui;
        }

        .sidebar {
            background: white;
            height: 100vh;
            border-left: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
        }

        .nav-header {
            background: var(--primary-dark);
            color: white;
            padding: 20px;
        }

        #map {
            height: 500px;
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            border: 2px solid white;
        }

        .courier-card {
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            transition: 0.3s;
            border-right: 4px solid transparent;
        }

            .courier-card:hover {
                background: #f8f9fa;
            }

            .courier-card.active {
                background: #e7f1ff;
                border-right-color: var(--accent);
            }

        .map-number-icon {
            background: var(--accent);
            color: white;
            border-radius: 50%;
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .route-step {
            position: relative;
            padding-right: 15px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 sidebar p-0">
                <div class="nav-header text-center">
                    <h4 class="mb-0">Smart Delivery</h4>
                    <small>ניהול משלוחים חכם</small>
                </div>

                <div class="p-3 border-bottom bg-light">
                    <button class="btn btn-primary w-100 shadow-sm fw-bold" onclick="runPlanRoutes()">
                        <i class="bi bi-magic"></i> שגר שיבוץ ומיטוב
                    </button>
                </div>

                <div class="p-3 flex-grow-1">
                    <h6 class="text-muted mb-3"><i class="bi bi-people"></i> בחר שליח לצפייה:</h6>
                    <div id="courier-list" class="list-group list-group-flush">
                        <div class="text-center p-3"><div class="spinner-border spinner-border-sm text-primary"></div></div>
                    </div>
                </div>

                <div class="p-3 border-top">
                    <button class="btn btn-outline-danger w-100 btn-sm" onclick="logout()">
                        <i class="bi bi-box-arrow-right"></i> התנתק מהמערכת
                    </button>
                </div>
            </div>

            <div class="col-md-9 p-4">
                <div id="welcome-msg" class="text-center py-5">
                    <i class="bi bi-map display-1 text-muted"></i>
                    <h2 class="mt-3">לוח בקרה ניהולי</h2>
                    <p class="text-muted">אנא בחר שליח מהרשימה או הרץ שיבוץ אוטומטי למשלוחים ממתינים.</p>
                </div>

                <div id="main-content" style="display: none;">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h3 id="courier-title" class="mb-0 fw-bold text-dark">שם השליח</h3>
                        <button class="btn btn-sm btn-outline-secondary shadow-sm px-3" onclick="zoomToFullRoute()">
                            <i class="bi bi-arrows-fullscreen me-1"></i> הצג מסלול מלא
                        </button>
                    </div>

                    <div id="map" class="mb-4"></div>

                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-white fw-bold border-bottom">
                            <i class="bi bi-list-ol text-primary me-1"></i> פירוט עצירות במסלול
                        </div>
                        <div class="card-body">
                            <div id="route-details" class="row"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_BASE = "https://localhost:44333/api";
        const token = localStorage.getItem('userToken');
        const role = localStorage.getItem('userRole'); 

        if (!token || role !== 'Admin') {
            alert("אינך מורשה לגשת לדף זה. רק מנהלים יכולים להיכנס.");
            window.location.href = 'login.html';
        }

        const map = L.map('map').setView([32.0853, 34.7818], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        let markersLayer = L.layerGroup().addTo(map);
        let polylineLayer = L.layerGroup().addTo(map);
        let currentRouteBounds = null;

        async function fetchWithAuth(url, options = {}) {
            const headers = { ...options.headers, 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
            return fetch(url, { ...options, headers });
        }

        async function runPlanRoutes() {
            try {
                const response = await fetchWithAuth(`${API_BASE}/RoutePlanning/plan`);

                if (response.ok) {
                    const data = await response.json();
                    alert("השיבוץ והמיטוב הסתיימו בהצלחה!");
                    location.reload();
                } else {
                    const error = await response.text();
                    alert("שגיאה: " + error);
                }
            } catch (err) {
                console.error("Error planning routes:", err);
            }
        }

        async function loadCouriers() {
            try {
                const res = await fetchWithAuth(`${API_BASE}/Courier`);

                if (res.status === 403) {
                    document.getElementById('courier-list').innerHTML =
                        '<div class="alert alert-danger m-2">אין לך הרשאות מנהל לצפייה בנתונים אלו.</div>';
                    return;
                }

                if (!res.ok) throw new Error("שגיאה בטעינה");

                const couriers = await res.json();
                const list = document.getElementById('courier-list');
                list.innerHTML = '';
                couriers.forEach(c => {
                    const item = document.createElement('div');
                    item.className = 'list-group-item courier-card p-3';
                    item.innerHTML = `<strong><i class="bi bi-person me-2"></i>${c.name}</strong>`;
                    item.onclick = () => selectCourier(c.id, c.name);
                    list.appendChild(item);
                });
            } catch (e) {
                console.error("Load Error:", e);
                document.getElementById('courier-list').innerHTML = '<div class="alert alert-warning">שגיאה בחיבור לשרת</div>';
            }
        }

        async function selectCourier(id, name) {
            document.getElementById('welcome-msg').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            document.getElementById('courier-title').innerText = "המסלול של " + name;

            markersLayer.clearLayers();
            polylineLayer.clearLayers();
            setTimeout(() => map.invalidateSize(), 100);

            const res = await fetchWithAuth(`${API_BASE}/Routes/courier/${id}`);
            const data = await res.json();
            renderRoute(data.stops || data.Stops || []);
        }

        function renderRoute(stops) {
            const container = document.getElementById('route-details');
            container.innerHTML = '';
            const points = [];

            stops.forEach((stop, index) => {
                const lat = stop.latitude || stop.Latitude;
                const lng = stop.longitude || stop.Longitude;
                const addr = stop.address || stop.Address || stop.dropoffAddress || stop.dropOffAddress || "כתובת לא ידועה";
                const pos = [lat, lng];
                points.push(pos);

                const isOrigin = index === 0;

                container.innerHTML += `
                        <div class="col-md-4 mb-3">
                            <div class="route-step">
                                <div class="p-3 border rounded ${isOrigin ? 'bg-success bg-opacity-10 border-success' : 'bg-white'} shadow-sm">
                                    <div class="d-flex align-items-center mb-2">
                                        <i class="bi ${isOrigin ? 'bi-house-fill text-success' : 'bi-geo-alt-fill text-primary'} me-2"></i>
                                        <small class="${isOrigin ? 'text-success' : 'text-primary'} fw-bold">
                                            ${isOrigin ? 'נקודת מוצא' : 'תחנה ' + (index + 1)}
                                        </small>
                                    </div>
                                    <div class="text-truncate mb-2" style="font-size: 0.95rem;">
                                        <strong title="${addr}">${addr}</strong>
                                    </div>
                                    <div class="d-flex justify-content-between border-top pt-2">
                                        <button class="btn btn-sm btn-link p-0 text-decoration-none" onclick="map.flyTo([${lat},${lng}],16)">
                                            <i class="bi bi-search"></i> התמקד
                                        </button>
                                        <a href="https://www.waze.com/ul?ll=${lat},${lng}&navigate=yes" target="_blank"
                                           class="btn btn-sm btn-success bg-opacity-75 border-0 py-0 px-2" style="font-size: 0.8rem;">
                                           <i class="bi bi-cursor-fill"></i> Waze
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>`;

                let icon;
                if (isOrigin) {
                    icon = L.divIcon({
                        className: '',
                        html: `<div style="background:#198754; width:32px; height:32px; border-radius:50%; border:2px solid white; display:flex; align-items:center; justify-content:center; color:white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);"><i class="bi bi-house-door"></i></div>`,
                        iconSize: [32, 32], iconAnchor: [16, 16]
                    });
                } else {
                    icon = L.divIcon({
                        className: 'map-number-icon',
                        html: index + 1,
                        iconSize: [26, 26], iconAnchor: [13, 13]
                    });
                }
                L.marker(pos, { icon: icon }).addTo(markersLayer).bindPopup(`<b>${isOrigin ? 'מוצא' : 'תחנה ' + (index + 1)}:</b><br>${addr}`);
            });

            if (points.length > 1) {
                const poly = L.polyline([...points, points[0]], { color: '#3498db', weight: 4, dashArray: '5, 10' }).addTo(polylineLayer);
                currentRouteBounds = poly.getBounds();
                map.fitBounds(currentRouteBounds, { padding: [50, 50] });
            }
        }

        function zoomToFullRoute() { if (currentRouteBounds) map.flyToBounds(currentRouteBounds, { padding: [50, 50] }); }
        function logout() { localStorage.clear(); window.location.href = 'login.html'; }

        loadCouriers();
    </script>
</body>
</html>
